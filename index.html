<script>
let currentAudio = null;

function playSound(file) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  currentAudio = new Audio(file);
  currentAudio.play();
}

function stopSound() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
}
</script>

<button id="stopBtn" onclick="stopSound()">STOP</button>

<style>
#stopBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 15px 25px;
  font-size: 18px;
  background: red;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
</style>
